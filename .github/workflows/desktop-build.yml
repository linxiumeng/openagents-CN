name: Build OpenAgents Launcher CN

on:
  workflow_dispatch:
  push:
    tags:
      - 'launcher-v*'
      - 'desktop-v*'
      - 'cn-v*'

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            build_script: build:mac:x64
          - arch: arm64
            build_script: build:mac:arm64
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/launcher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm cache clean --force
          npm install

      - name: Build macOS app
        run: npm run ${{ matrix.build_script }}

      - name: Ad-hoc sign .app and rebuild DMG
        run: |
          APP_PATH=$(find dist/mac* -maxdepth 1 -name "*.app" -type d | head -1)
          echo "Signing $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          codesign -dvvv "$APP_PATH" 2>&1 | grep -E "Signature|adhoc|Authority"

          # Rebuild DMG with signed .app (skip signing in builder)
          DMG_FILE=$(ls dist/*-mac-${{ matrix.arch }}.dmg | head -1)
          echo "Rebuilding DMG from signed app: $DMG_FILE"
          rm -f "$DMG_FILE"
          npx electron-builder --mac --${{ matrix.arch }} --publish never --config.mac.identity=null

      - name: Verify macOS artifacts
        run: |
          ls -la dist
          ls dist/*-mac-${{ matrix.arch }}.dmg >/dev/null
          ls dist/*-mac-${{ matrix.arch }}.zip >/dev/null

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launcher-macos-${{ matrix.arch }}
          path: |
            packages/launcher/dist/*-mac-${{ matrix.arch }}.dmg
            packages/launcher/dist/*-mac-${{ matrix.arch }}.zip
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/launcher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm cache clean --force
          npm install

      - name: Build Windows app
        run: npm run build:win

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows-unsigned
          path: |
            packages/launcher/dist/*.exe
            packages/launcher/dist/*.msi
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/launcher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm cache clean --force
          npm install

      - name: Build Linux app
        run: npm run build:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launcher-linux
          path: |
            packages/launcher/dist/*.AppImage
            packages/launcher/dist/*.deb
          if-no-files-found: warn

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: always() && (startsWith(github.ref, 'refs/tags/launcher-v') || startsWith(github.ref, 'refs/tags/desktop-v') || startsWith(github.ref, 'refs/tags/cn-v')) && !failure() && !cancelled()

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: launcher-macos-*
          path: artifacts
          merge-multiple: true

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: launcher-linux
          path: artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: launcher-windows-unsigned
          path: artifacts

      - name: List release artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "OpenAgents Launcher CN ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: artifacts/*
          generate_release_notes: true
