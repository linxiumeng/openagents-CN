# Project information
site_name: OpenAgents
site_description: 大规模连接 AI 智能体的开放框架
site_author: OpenAgents
site_url: https://openagents.org

# Repository
repo_name: bestagents/openagents
repo_url: https://github.com/bestagents/openagents
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2023 OpenAgents Team

# Configuration
theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/robot
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.code.annotate
  custom_dir: docs/overrides

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Plugins
plugins:
  - search
  - autorefs:
      link_titles: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
  - git-revision-date-localized:
      type: date

# Extra CSS
extra_css:
  - stylesheets/extra.css

# Extra
extra:
  404_page: 404.md
  homepage: https://openagents.org
  social:
    - icon: fontawesome/solid/globe
      link: https://openagents.org
      name: OpenAgents Website

# Navigation structure
nav:
  - 首页: index.md
  - 快速开始:
    - 安装: getting-started/installation.md
    - 快速入门: getting-started/quick-start.md
    - 基本概念: getting-started/basic-concepts.md
  - 用户指南:
    - 创建智能体: user-guide/creating-agents.md
    - 搭建网络: user-guide/setting-up-networks.md
    - 使用协议: user-guide/using-protocols.md
    - 配置文件: user-guide/configuration-files.md
    - 命令行接口: user-guide/command-line-interface.md
  - 协议:
    - 概述: protocols/overview.md
    - 发现协议: protocols/discovery.md
    - 通信协议: protocols/communication.md
    - 心跳协议: protocols/heartbeat.md
    - 身份协议: protocols/identity.md
    - 协调协议: protocols/coordination.md
    - 资源管理协议: protocols/resource-management.md
  - 高级主题:
    - 自定义协议: advanced/custom-protocols.md
    - 智能体模式: advanced/agent-patterns.md
    - 网络拓扑: advanced/network-topologies.md
    - 安全考量: advanced/security.md
    - 性能优化: advanced/performance.md
  - API 参考:
    - 核心: api/core.md
    - 协议: api/protocols.md
    - 模型: api/models.md
    - 命令行: api/cli.md
  - 开发:
    - 贡献指南: development/contributing.md
    - 开发环境搭建: development/setup.md
    - 测试: development/testing.md
    - 文档: development/documentation.md
  - 示例:
    - 基本网络: examples/basic-network.md
    - 服务发现: examples/service-discovery.md
    - 发布-订阅消息: examples/pub-sub-messaging.md
    - 请求-响应: examples/request-response.md
  - 常见问题: faq.md
  - 更新日志: changelog.md 